name: Spring Boot CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: springboot-production-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  CONTAINER_NAME: springboot-app
  CONTAINER_PORT: "8080"
  HOST_PORT: "8080"

jobs:

  # ==================================================
  # JOB 1: TEST AND BUILD SPRING BOOT APPLICATION
  # ==================================================

  build:
    name: Build and Test Spring Boot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Java and Maven Versions
        run: |
          java -version
          javac -version
          mvn -version

      - name: Run Unit Tests
        run: mvn -B clean test

      - name: Build Spring Boot Application
        run: mvn -B package -DskipTests

      - name: Verify Generated JAR
        run: |
          echo "Files generated inside target directory:"
          ls -lh target/

          JAR_COUNT=$(find target -maxdepth 1 -type f \
            -name "*.jar" ! -name "*.original" | wc -l)

          if [ "$JAR_COUNT" -eq 0 ]; then
            echo "No executable JAR file was generated."
            exit 1
          fi

          echo "Spring Boot JAR generated successfully."

      - name: Upload Spring Boot JAR
        uses: actions/upload-artifact@v4
        with:
          name: springboot-jar
          path: |
            target/*.jar
            !target/*.jar.original
          if-no-files-found: error
          retention-days: 7

  # ==================================================
  # JOB 2: BUILD DOCKER IMAGE AND PUSH TO AMAZON ECR
  # ==================================================

  docker:
    name: Build and Push Docker Image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Pull requests run only the build job.
    # Docker push runs for main branch pushes and manual runs.
    if: github.event_name != 'pull_request'

    outputs:
      image_uri: ${{ steps.image-info.outputs.image_uri }}
      image_tag: ${{ steps.image-info.outputs.image_tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Spring Boot JAR
        uses: actions/download-artifact@v4
        with:
          name: springboot-jar
          path: target

      - name: Verify Downloaded JAR
        run: |
          echo "Downloaded files:"
          ls -lh target/

          JAR_COUNT=$(find target -maxdepth 1 -type f \
            -name "*.jar" ! -name "*.original" | wc -l)

          if [ "$JAR_COUNT" -eq 0 ]; then
            echo "No JAR file found after artifact download."
            exit 1
          fi

          echo "Downloaded JAR verified successfully."

      - name: Validate AWS Configuration
        env:
          ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
     
