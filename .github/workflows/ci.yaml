name: Spring Boot CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: springboot-production-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  CONTAINER_NAME: springboot-app
  CONTAINER_PORT: "8080"
  HOST_PORT: "8080"

jobs:

  # ==================================================
  # JOB 1: TEST AND BUILD SPRING BOOT APPLICATION
  # ==================================================

  build:
    name: Build and Test Spring Boot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Java and Maven Versions
        run: |
          java -version
          javac -version
          mvn -version

      - name: Run Unit Tests
        run: mvn clean test

      - name: Build Spring Boot Application
        run: mvn package -DskipTests

      - name: Verify Generated JAR
        run: |
          echo "Files generated inside target directory:"
          ls -lh target/

          JAR_COUNT=$(find target -maxdepth 1 -type f -name "*.jar" ! -name "*.original" | wc -l)

          if [ "$JAR_COUNT" -eq 0 ]; then
            echo "No executable JAR file was generated."
            exit 1
          fi

          echo "Spring Boot JAR generated successfully."

      - name: Upload Spring Boot JAR
        uses: actions/upload-artifact@v4
        with:
          name: springboot-jar
          path: |
            target/*.jar
            !target/*.jar.original
          if-no-files-found: error
          retention-days: 7

  # ==================================================
  # JOB 2: BUILD DOCKER IMAGE AND PUSH TO AMAZON ECR
  # ==================================================

  docker:
    name: Build and Push Docker Image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Pull requests should only run build and tests.
    # Docker push and deployment run only for pushes/manual runs.
    if: github.event_name != 'pull_request'

    outputs:
      image_uri: ${{ steps.image-info.outputs.image_uri }}
      image_tag: ${{ steps.image-info.outputs.image_tag }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Spring Boot JAR
        uses: actions/download-artifact@v4
        with:
          name: springboot-jar
          path: target

      - name: Verify Downloaded JAR
        run: |
          echo "Downloaded files:"
          ls -lh target/

          JAR_COUNT=$(find target -maxdepth 1 -type f -name "*.jar" ! -name "*.original" | wc -l)

          if [ "$JAR_COUNT" -eq 0 ]; then
            echo "No JAR file found after artifact download."
            exit 1
          fi

      - name: Validate Required GitHub Variables
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_REGION" ]; then
            echo "AWS_REGION repository variable is missing."
            exit 1
          fi

          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "AWS_ACCOUNT_ID repository variable is missing."
            exit 1
          fi

          if [ -z "$ECR_REPOSITORY" ]; then
            echo "ECR_REPOSITORY repository variable is missing."
            exit 1
          fi

          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "AWS_ROLE_ARN repository variable is missing."
            exit 1
          fi

          echo "AWS Region: $AWS_REGION"
          echo "AWS Account ID configured: yes"
          echo "ECR Repository: $ECR_REPOSITORY"
          echo "AWS role ARN configured: yes"

      - name: Configure AWS Credentials Using OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: GitHubActions-ECR-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Verify ECR Repository
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate Docker Image Information
        id: image-info
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

          echo "Docker image tag: $IMAGE_TAG"
          echo "Docker image URI prepared successfully."

      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-info.outputs.image_tag }}
        run: |
          docker build \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .

      - name: Verify Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-info.outputs.image_tag }}
        run: |
          docker image inspect \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker images

      - name: Push Docker Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.image-info.outputs.image_tag }}
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Verify Image in Amazon ECR
        env:
          IMAGE_TAG: ${{ steps.image-info.outputs.image_tag }}
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION"

  # ==================================================
  # JOB 3: DEPLOY DOCKER IMAGE TO EC2 USING AWS SSM
  # ==================================================

  deploy:
    name: Deploy Spring Boot Application to EC2
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Deployment runs only from the main branch.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    environment:
      name: production

    steps:
      - name: Validate Deployment Variables
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_REGION" ]; then
            echo "AWS_REGION repository variable is missing."
            exit 1
          fi

          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "AWS_ACCOUNT_ID repository variable is missing."
            exit 1
          fi

          if [ -z "$ECR_REPOSITORY" ]; then
            echo "ECR_REPOSITORY repository variable is missing."
            exit 1
          fi

          if [ -z "$EC2_INSTANCE_ID" ]; then
            echo "EC2_INSTANCE_ID repository variable is missing."
            exit 1
          fi

          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "AWS_ROLE_ARN repository variable is missing."
            exit 1
          fi

          echo "Required deployment variables are available."

      - name: Configure AWS Credentials Using OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          audience: sts.amazonaws.com
          role-session-name: GitHubActions-Deploy-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Confirm EC2 Is Managed by Systems Manager
        run: |
          INSTANCE_STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$EC2_INSTANCE_ID" \
            --query "InstanceInformationList[0].PingStatus" \
            --output text \
            --region "$AWS_REGION")

          echo "SSM instance status: $INSTANCE_STATUS"

          if [ "$INSTANCE_STATUS" != "Online" ]; then
            echo "EC2 instance is not online in AWS Systems Manager."
            echo "Verify the SSM Agent and EC2 IAM instance profile."
            exit 1
          fi

      - name: Deploy Application Through AWS Systems Manager
        id: deploy
        env:
          IMAGE_TAG: ${{ needs.docker.outputs.image_tag }}
        run: |
          IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG"
          REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

          PARAMETERS=$(jq -n \
            --arg region "$AWS_REGION" \
            --arg registry "$REGISTRY" \
            --arg image "$IMAGE_URI" \
            --arg container "$CONTAINER_NAME" \
            --arg host_port "$HOST_PORT" \
            --arg container_port "$CONTAINER_PORT" \
            '{
              commands: [
                "set -e",
                "echo Starting Spring Boot deployment",
                ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),
                ("docker pull " + $image),
                ("docker stop " + $container + " || true"),
                ("docker rm " + $container + " || true"),
                ("docker run -d --name " + $container + " --restart unless-stopped -p " + $host_port + ":" + $container_port + " " + $image),
                ("docker image prune -f"),
                ("docker ps --filter name=" + $container),
                ("docker logs --tail 50 " + $container)
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Spring Boot image $IMAGE_TAG from GitHub Actions" \
            --parameters "$PARAMETERS" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Deployment Command
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          echo "Waiting for SSM command to complete..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"

      - name: Display Deployment Result
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          echo "Deployment output:"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardOutputContent" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment error output:"

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "StandardErrorContent" \
              --output text

            exit 1
          fi

      - name: Verify Spring Boot Container
        id: verify
        run: |
          PARAMETERS=$(jq -n \
            --arg container "$CONTAINER_NAME" \
            --arg port "$CONTAINER_PORT" \
            '{
              commands: [
                "set -e",
                "sleep 20",
                ("docker ps --filter name=" + $container),
                ("docker inspect -f {{.State.Running}} " + $container),
                ("curl --fail --silent --show-error http://localhost:" + $port + "/actuator/health || curl --fail --silent --show-error http://localhost:" + $port + "/")
              ]
            }')

          VERIFY_COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Verify Spring Boot application after deployment" \
            --parameters "$PARAMETERS" \
            --region "$AWS_REGION" \
            --query "Command.CommandId" \
            --output text)

          echo "verify_command_id=$VERIFY_COMMAND_ID" >> "$GITHUB_OUTPUT"

          aws ssm wait command-executed \
            --command-id "$VERIFY_COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION"

      - name: Display Application Verification
        env:
          VERIFY_COMMAND_ID: ${{ steps.verify.outputs.verify_command_id }}
        run: |
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$VERIFY_COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "Status" \
            --output text)

          echo "Application verification status: $STATUS"

          aws ssm get-command-invocation \
            --command-id "$VERIFY_COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query "StandardOutputContent" \
            --output text

          if [ "$STATUS" != "Success" ]; then
            echo "Application verification failed."

            aws ssm get-command-invocation \
              --command-id "$VERIFY_COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query "StandardErrorContent" \
              --output text

            exit 1
          fi

          echo "Spring Boot application deployed successfully."
